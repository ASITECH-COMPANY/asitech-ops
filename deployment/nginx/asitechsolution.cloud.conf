# Host reverse-proxy vhost for the ASITECH OPS landing page (asitechsolution.cloud).
#
# Installed by deployment/scripts/deploy-landing.sh, which substitutes the domain,
# the container port and the ACME webroot from landing/.env. The script never
# overwrites an existing vhost without explicit approval and runs `nginx -t`
# before any reload. Manual installation: see docs/landing/deployment.md.
#
# Compatible with Nginx 1.18+ (Ubuntu 22.04 / 24.04).

# --- HTTP: ACME challenges, then redirect everything to HTTPS ---------------------
server {
    listen 80;
    listen [::]:80;
    server_name asitechsolution.cloud www.asitechsolution.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # BEGIN-HTTP-DEFAULT
    location / {
        return 301 https://asitechsolution.cloud$request_uri;
    }
    # END-HTTP-DEFAULT
}

# BEGIN-HTTPS
# --- HTTPS: www -> apex ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.asitechsolution.cloud;

    ssl_certificate     /etc/letsencrypt/live/asitechsolution.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asitechsolution.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://asitechsolution.cloud$request_uri;
}

# --- HTTPS: the site ----------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asitechsolution.cloud;

    ssl_certificate     /etc/letsencrypt/live/asitechsolution.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asitechsolution.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS lives here, not in the container. includeSubDomains: every subdomain
    # (e.g. get.asitechsolution.cloud) must also be served over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
# END-HTTPS
