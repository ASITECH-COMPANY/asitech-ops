# Host reverse-proxy vhost for the ASITECH OPS Control Plane (ops.asitechsolution.cloud).
#
# Installed by deployment/scripts/deploy-control-plane.sh, which substitutes the
# domain and the local port of the "web" container (127.0.0.1:8090). Same rules
# as the landing vhost: never overwritten without approval, `nginx -t` before reload.

# --- HTTP: ACME challenges, then redirect everything to HTTPS ---------------------
server {
    listen 80;
    listen [::]:80;
    server_name ops.asitechsolution.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # BEGIN-HTTP-DEFAULT
    location / {
        return 301 https://ops.asitechsolution.cloud$request_uri;
    }
    # END-HTTP-DEFAULT
}

# BEGIN-HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ops.asitechsolution.cloud;

    ssl_certificate     /etc/letsencrypt/live/ops.asitechsolution.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.asitechsolution.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # WebSockets: dashboard live updates and agent connections.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        # Overwritten (not appended) so clients cannot forge their address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
# END-HTTPS
