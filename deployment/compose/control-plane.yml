# ASITECH OPS Control Plane — production stack.
# Deployed by deployment/scripts/deploy-control-plane.sh, which creates the .env
# file next to this one (secrets generated on the server, mode 600).
#
# Only the "web" service is published, on 127.0.0.1: the host reverse proxy
# (Nginx) terminates TLS and exposes it. PostgreSQL and Redis live on an
# internal network with no route to the outside.
name: asitech-ops

x-backend: &backend
  image: asitech-ops-backend:${ASITECH_IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # Only the "web" container can reach the backend: trust its forwarded headers.
    FORWARDED_ALLOW_IPS: "*"
    # One process by default: on small or overloaded hosts, uvicorn's multi-process
    # supervisor kills workers that start slowly. Raise it on dedicated servers.
    WEB_CONCURRENCY: ${OPS_WEB_CONCURRENCY:-1}
    EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.dummy.EmailBackend}
  networks: [internal, edge]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17.11-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asitech_ops}
      POSTGRES_USER: ${POSTGRES_USER:-asitech_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  redis:
    image: redis:8.6.8-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  backend:
    <<: *backend
    build:
      context: ../../backend
      target: prod
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput --verbosity 0 && exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --proxy-headers
    volumes:
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready/', headers={'Host': 'localhost'}), timeout=3)"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 180s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=${OPS_WORKER_CONCURRENCY:-1}"]
    healthcheck:
      disable: true

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  web:
    image: asitech-ops-web:${ASITECH_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deployment/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPS_HTTP_PORT:-8090}:8080"
    volumes:
      - static:/usr/share/nginx/static:ro
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

volumes:
  postgres-data:
  static:

networks:
  internal:
    internal: true
  edge: {}
