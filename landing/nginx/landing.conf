# ASITECH OPS landing page — Nginx config inside the container.
# Runs unprivileged on :8080. TLS and HSTS are handled by the host reverse proxy.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml text/plain text/xml;
    # Keep redirects relative so scheme and host from the host proxy are preserved.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/ld+json application/xml image/svg+xml;

    # Health endpoint for Docker and the deployment script.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Fingerprinted build assets never change: cache for one year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else (HTML, robots.txt, sitemap, icons): revalidate on each visit,
    # so a new deployment is visible immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # Static pages only: unknown paths get a real 404 instead of the home page
        # (no soft-404s in search engines).
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
