name: Landing (asitechsolution.cloud)

on:
  pull_request:
    paths:
      - "landing/**"
      - "deployment/nginx/asitechsolution.cloud.conf"
      - "deployment/scripts/deploy-landing.sh"
      - ".github/workflows/landing.yml"
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "deployment/nginx/asitechsolution.cloud.conf"
      - "deployment/scripts/deploy-landing.sh"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, checks, Lighthouse
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: HTML validation, links, weight budget
        run: npm run check
      - name: Lighthouse (mobile, every category >= 0.9)
        run: npx --yes @lhci/cli@0.16.0 autorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-dist
          path: landing/dist
          retention-days: 7

  image:
    name: Docker image smoke test
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t asitech-landing:ci landing
      - name: Run hardened container (read-only, no capabilities, localhost only)
        run: |
          docker run -d --name landing --read-only \
            --tmpfs /tmp:size=16m,mode=1777 --tmpfs /var/cache/nginx:size=16m,uid=101,gid=101 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:8088:8080 asitech-landing:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/healthz && break; sleep 1; done
      - name: Verify responses and headers
        run: |
          set -x
          test "$(curl -fsS http://127.0.0.1:8088/healthz)" = "ok"
          curl -fsS http://127.0.0.1:8088/ | grep -q 'lang="fr"'
          curl -fsS http://127.0.0.1:8088/en/ | grep -q 'lang="en"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/does-not-exist)" = "404"
          headers="$(curl -sSI http://127.0.0.1:8088/)"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          ! echo "$headers" | grep -qi '^strict-transport-security:'
          asset="$(curl -fsS http://127.0.0.1:8088/ | grep -o '/assets/[^"]*\.css' | head -1)"
          curl -sSI "http://127.0.0.1:8088$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          test "$(docker inspect landing --format '{{.Config.User}}')" != "root"
      - name: Validate the host vhost template with nginx -t
        run: |
          mkdir -p /tmp/vhost/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=asitechsolution.cloud" \
            -keyout /tmp/vhost/certs/privkey.pem -out /tmp/vhost/certs/fullchain.pem
          chmod 644 /tmp/vhost/certs/*.pem
          sed 's#/etc/letsencrypt/live/asitechsolution.cloud#/certs#' \
            deployment/nginx/asitechsolution.cloud.conf > /tmp/vhost/site.conf
          docker run --rm -v /tmp/vhost/site.conf:/etc/nginx/conf.d/default.conf:ro \
            -v /tmp/vhost/certs:/certs:ro nginxinc/nginx-unprivileged:1.30.6-alpine3.24 nginx -t
      - if: always()
        run: docker logs landing || true

  deploy:
    # Optional and disabled by default: set the repository variable LANDING_AUTO_DEPLOY=true
    # and the secrets described in docs/landing/deployment.md.
    name: Deploy to the ASITECH server
    needs: [build, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LANDING_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: landing-deploy
      cancel-in-progress: false
    steps:
      - name: Run deploy-landing.sh over SSH (forced command on the server)
        env:
          SSH_KEY: ${{ secrets.LANDING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LANDING_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.LANDING_SSH_HOST }}
          SSH_USER: ${{ secrets.LANDING_SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" deploy-landing
